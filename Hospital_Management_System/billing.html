<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billing - MediCare</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/billing.css">
</head>
<body>

<header class="navbar">
  <div class="logo">Medi<span>Care</span></div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="patient.html">Patients</a></li>
      <li><a href="doctor.html">Doctors</a></li>
      <li><a href="appointment.html">Appointments</a></li>
      <li><a href="department.html">Departments</a></li>
      <li><a href="billing.html" class="active">Billing</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  <button id="themeToggle" class="theme-btn">🌙</button>
</header>

<section class="form-section" id="printArea">
  <h2>Generate Bill</h2>
  <form id="billingForm">
    <input type="hidden" id="billId">
    <div class="form-grid">
      <input type="text" id="bPatient" placeholder="Patient Name" required>
      <input type="number" id="bTreatment" placeholder="Treatment Fee" min="0" value="0">
      <input type="number" id="bMedicine" placeholder="Medicine Fee" min="0" value="0">
      <input type="number" id="bRoom" placeholder="Room Charge" min="0" value="0">
    </div>
    <h3>Total: $<span id="billTotal">0</span></h3>
    <button type="submit" class="btn-primary">Save Bill</button>
    <button type="button" id="printBill" class="btn-secondary">🖨️ Print Bill</button>
    <button type="button" id="resetBillForm" class="btn-secondary">Clear</button>
  </form>
</section>

<section class="table-section">
  <table>
    <thead>
      <tr><th>Patient</th><th>Treatment</th><th>Medicine</th><th>Room</th><th>Total</th><th>Actions</th></tr>
    </thead>
    <tbody id="billTable"></tbody>
  </table>
</section>

<footer class="footer">
  <p>© 2026 MediCare Hospital Management System. All Rights Reserved.</p>
</footer>

<div id="toast" class="toast"></div>

<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/billing.js"></script>
</body>
</html>
